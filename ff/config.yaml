seed: 3
device: "cuda"

input:
  batch_size: 16


model:
  peer_normalization: 0.03 #Peer normalization loss coefficient
  momentum: 0.9 #Momentum for running mean in peer normalization loss

  hidden_dim: 64 #Size of hidden layer
  num_layers: 2


training:
  epochs: 1
  early_stop_threshold: 100

  learning_rate: 1e-3
  weight_decay: 3e-4
  momentum: 0.9

  downstream_learning_rate: 1e-2
  downstream_weight_decay: 3e-3

  val_index: 1  #-1 = validate only once training has finished | n = validate every n epochs.
  final_test: Test


hydra:
  run:
    dir: logs